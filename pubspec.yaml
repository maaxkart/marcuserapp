name: marc_app

description: Marc App - Ultra Premium Online Educational Learning Platform

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

# =========================================================
# DEPENDENCIES
# =========================================================

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  # STORAGE
  shared_preferences: ^2.2.2

  # API
  http: ^1.2.2

  # VIDEO
  video_player: ^2.8.6

  # MEDIA KIT
  media_kit: ^1.1.11
  media_kit_video: ^1.2.4
  media_kit_libs_video: ^1.0.4

  # FIREBASE
  firebase_core: ^3.6.0
  cloud_firestore: ^5.4.4
  firebase_auth: ^5.3.1
  firebase_messaging: ^15.1.3
  firebase_database: ^11.1.4

  # NOTIFICATION
  flutter_local_notifications: ^17.2.3

  # UTIL
  intl: ^0.19.0

  # 100MS LIVE SDK
  hmssdk_flutter: ^1.11.1
  url_launcher: ^6.3.0

# =========================================================
# DEV DEPENDENCIES
# =========================================================

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

# =========================================================
# FLUTTER
# =========================================================

flutter:

  uses-material-design: true

  assets:
    - assets/images/

  # Example:
  # assets:
  #   - assets/images/
  #   - assets/icons/

  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: fonts/CustomFont-Regular.ttf